name: Maçları topla

on:
  schedule:
    - cron: "17 */3 * * *"   # her 3 saatte bir
  workflow_dispatch:          # elle çalıştırma

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toplayıcıyı çalıştır
        env:
          HENRIK_KEY: ${{ secrets.HENRIK_KEY }}
        run: python collector/collect.py
      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "valorant-lig-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "Maç verisi güncellendi"
            git push
          else
            echo "Yeni maç yok"
          fi
